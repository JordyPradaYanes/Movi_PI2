<div class="flex h-screen">
    <!-- Sidebar -->
    <div 
      class="bg-gray-800 text-white w-64 flex flex-col shadow-lg transition-all duration-300"
      [ngClass]="{'w-16': menuColapsado, 'w-64': !menuColapsado}"
    >
      <!-- Logo y título -->
      <div class="p-4 flex items-center justify-between border-b border-gray-700">
        <div class="flex items-center">
          <img src="assets/icons/bus-logo.png" alt="Logo" class="rounded-full h-20 w-20 mr-2" *ngIf="!menuColapsado">
          <img src="assets/icons/bus-logo-small.png" alt="Logo" class="h-20 w-20" *ngIf="menuColapsado">
          <h1 class="text-xl ml-6 font-bold whitespace-nowrap" *ngIf="!menuColapsado">
            Movi
          </h1>
        </div>
        <button 
          class="text-gray-400 hover:text-white focus:outline-none"
          (click)="toggleMenu()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!menuColapsado" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
            <path *ngIf="menuColapsado" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
          </svg>
        </button>
      </div>
  
      <!-- Menú de navegación -->
      <nav class="flex-1 overflow-y-auto pt-4">
        <ul>
          <!-- Inicio -->
          <li>
            <a 
              routerLink="/inicio" 
              routerLinkActive="bg-blue-700"
              class="flex items-center py-3 px-4 text-gray-300 hover:bg-gray-700 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
              <span class="ml-3" *ngIf="!menuColapsado">Inicio</span>
            </a>
          </li>
  
          <!-- Mapa -->
          <li>
            <a 
              routerLink="/mapa" 
              routerLinkActive="bg-blue-700"
              class="flex items-center py-3 px-4 text-gray-300 hover:bg-gray-700 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
              </svg>
              <span class="ml-3" *ngIf="!menuColapsado">Mapa de Rutas</span>
            </a>
          </li>
  
          <!-- Rutas -->
          <li>
            <a 
              routerLink="/rutas" 
              routerLinkActive="bg-blue-700"
              class="flex items-center py-3 px-4 text-gray-300 hover:bg-gray-700 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17l6-6-6-6" />
              </svg>
              <span class="ml-3" *ngIf="!menuColapsado">Rutas Disponibles</span>
            </a>
          </li>
  
          <!-- Busetas -->
          <li>
            <a 
              routerLink="/busetas" 
              routerLinkActive="bg-blue-700"
              class="flex items-center py-3 px-4 text-gray-300 hover:bg-gray-700 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
              </svg>
              <span class="ml-3" *ngIf="!menuColapsado">Busetas en Servicio</span>
            </a>
          </li>
  
          <!-- Tiempo Real -->
          <li>
            <a 
              routerLink="/tiempo-real" 
              routerLinkActive="bg-blue-700"
              class="flex items-center py-3 px-4 text-gray-300 hover:bg-gray-700 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span class="ml-3" *ngIf="!menuColapsado">Monitoreo en Tiempo Real</span>
            </a>
          </li>
  
          <!-- Paradas -->
          <li>
            <a 
              routerLink="/paradas" 
              routerLinkActive="bg-blue-700"
              class="flex items-center py-3 px-4 text-gray-300 hover:bg-gray-700 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span class="ml-3" *ngIf="!menuColapsado">Paradas</span>
            </a>
          </li>
        </ul>
      </nav>
  
      <!-- Información de contacto -->
      <div class="p-4 border-t border-gray-700 text-xs" *ngIf="!menuColapsado">
        <p class="text-gray-400">Sistema de Transporte Público</p>
        <p class="text-gray-400">Ocaña, Norte de Santander</p>
      </div>
    </div>
  
    <!-- Contenido principal -->
    <div class="flex-1 overflow-x-hidden overflow-y-auto">
      <div class="p-4">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
